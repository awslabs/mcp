# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Ensure the file passes validation:
# ```shell
# % npx @bugron/validate-dependabot-yaml .github/dependabot.yml
# ```

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps): update github-actions"
    groups:
      github-actions-version-updates:
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    # `cooldown` lets a fresh release settle before a version-update PR is
    # raised (7 days here; the built-in default is 3). Cooldown and the
    # open-PR limit both apply to VERSION updates only — security updates are
    # exempt from both, so the security-advisory fan-out is instead bounded by
    # the *-security-updates group below, which collapses a directory's
    # security bumps into one PR. `open-pull-requests-limit` is left at its
    # default (5); lower it here if version-update volume needs a harder cap.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps): update uv"
    groups:
      uv-version-updates:
        # Collapse this dependency's bump across every matched directory into a
        # single PR. Without this, `directories: ["**/*"]` groups only WITHIN
        # each directory. (Currently blocked by dependabot-core#14286 — see #4370.)
        group-by: dependency-name
        patterns:
          - "*"
      uv-security-updates:
        # Security updates ignore the PR limit and cooldown, so group them (per
        # directory) to keep the advisory fan-out reviewable. No group-by:
        # cross-directory grouping is the feature broken by #14286.
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps): update npm"
    groups:
      npm-version-updates:
        # One PR per dependency across all directories (see uv note above).
        group-by: dependency-name
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps): update docker images"
    groups:
      docker-version-updates:
        # One PR per image across all directories (see uv note above).
        group-by: dependency-name
        patterns:
          - "*"
      docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

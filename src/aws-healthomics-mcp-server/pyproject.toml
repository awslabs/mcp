[project]
name = "awslabs.aws-healthomics-mcp-server"
version = "0.1.0"
description = "An AWS Labs Model Context Protocol (MCP) server for AWS HealthOmics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.36",
    "botocore>=1.43.36",
    "loguru>=0.7.0",
    "mcp[cli]>=2.0.0,<3.0.0",
    "pydantic>=2.10.6",
    "cwltool[deps]>=3.1.0",
    # Direct declaration required so [tool.uv.sources] below can redirect this
    # transitive cwltool dependency to a local stub instead of PyPI.
    "spython>=0.3.0",
    # Direct dependencies of the vendored WDL parser/lint modules under
    # awslabs/aws_healthomics_mcp_server/vendor/wdl/ (see VENDORED.md there).
    # We depend on these instead of `miniwdl` itself to avoid miniwdl's hard
    # dependency on the GPL-licensed `pygtail`.
    "regex>=2020.4.4",
    "lark~=1.2",
    "python-json-logger>=2,<4",
    "coloredlogs>=15.0",
    "ruamel-yaml>=0.18.0",
    "isodate>=0.6.0",
    "nest-asyncio>=1.5.0",
    "polars>=1.0.0",
    "python-multipart>=0.0.22",
]
license = {text = "Apache-2.0"}
license-files = ["LICENSE", "NOTICE" ]
authors = [
    {name = "Amazon Web Services"},
    {name = "AWSLabs MCP", email="203918161+awslabs-mcp@users.noreply.github.com"},
    {name = "Your Name", email="githubusername@users.noreply.github.com"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
homepage = "https://awslabs.github.io/mcp/"
docs = "https://awslabs.github.io/mcp/servers/aws-healthomics-mcp-server/"
documentation = "https://awslabs.github.io/mcp/servers/aws-healthomics-mcp-server/"
repository = "https://github.com/awslabs/mcp.git"
changelog = "https://github.com/awslabs/mcp/blob/main/src/aws-healthomics-mcp-server/CHANGELOG.md"

[project.scripts]
"awslabs.aws-healthomics-mcp-server" = "awslabs.aws_healthomics_mcp_server.server:main"

[dependency-groups]
dev = [
    "commitizen>=4.2.2",
    "pre-commit>=4.1.0",
    "ruff>=0.9.7",
    "pyright>=1.1.398",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "bandit>=1.8.6",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
# cwltool unconditionally depends on spython (MPL-2.0) for Singularity support,
# a feature this server never exercises (only `cwltool --validate` is used).
# Satisfy that dependency from a local no-op stub instead of installing the
# real MPL-2.0 package. See third_party_stubs/spython/README.md.
spython = { path = "third_party_stubs/spython", editable = true }

[tool.ruff]
line-length = 99
extend-include = ["*.ipynb"]
exclude = [
    ".venv",
    "**/__pycache__",
    "**/node_modules",
    "**/dist",
    "**/build",
    "**/env",
    "**/.ruff_cache",
    "**/.venv",
    "**/.ipynb_checkpoints",
    # Vendored verbatim from upstream miniwdl; not reformatted/relinted so
    # re-vendoring produces a clean diff against upstream. See VENDORED.md.
    "awslabs/aws_healthomics_mcp_server/vendor/wdl",
]
force-exclude = true

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["C", "D", "E", "F", "I", "W"]
ignore = ["C901", "E501", "E741", "F402", "F823", "D100", "D106"]

[tool.ruff.lint.isort]
lines-after-imports = 2
no-sections = true

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["F704"]
"tests/**" = ["D102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
include = ["awslabs", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "**/dist",
    "**/build",
    "awslabs/aws_healthomics_mcp_server/vendor/wdl",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "awslabs/aws_healthomics_mcp_server/__init__.py:__version__"
]
update_changelog_on_bump = true

[tool.hatch.build.targets.wheel]
packages = ["awslabs"]

[tool.bandit]
exclude_dirs = ["venv", ".venv", "tests", "awslabs/aws_healthomics_mcp_server/vendor/wdl"]

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = [ "tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that make live API calls (deselect with '-m \"not live\"')",
    "asyncio: marks tests that use asyncio"
]

[tool.coverage.report]
exclude_also = [
    'pragma: no cover',
    'if __name__ == .__main__.:\n    main()',
]

[tool.coverage.run]
source = ["awslabs"]
omit = ["awslabs/aws_healthomics_mcp_server/vendor/wdl/*"]
